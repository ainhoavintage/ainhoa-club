<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ainhoa Club Card</title>
<meta name="theme-color" content="#252A1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Club Card">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* Layout: una columna angosta (máx 520px), tarjeta de socia arriba, todo lo demás en blanco con filetes finos. */
:root {
  --paper: #FFFFFF;
  --bone: #F7F4EF;
  --bone2: #EFEAE2;
  --line: #E6DFD4;
  --ink: #252A1C;
  --ink2: #3A4030;
  --rose: #BC7779;
  --rose-soft: #F6EBEA;
  --earth: #69543D;
  --cacao: #4F2817;
  --mute: #8A8274;
  --ok: #4C7A5E;
  --ok-soft: #EDF4EF;
  --warn: #8A6A1F;
  --warn-soft: #FBF4E4;
  --bad: #A4504F;
  --bad-soft: #F8ECEB;
  --display: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
  --body: 'DM Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  --r: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; font-weight: 400; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 96px; }

/* ---------- encabezado (igual a las otras apps de Ainhoa) ---------- */
.top { background: var(--ink); color: #F3EEE6; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px; text-align: center; position: relative; }
.brand { font-family: var(--display); font-weight: 300; font-size: 27px; letter-spacing: .2em; line-height: 1; text-transform: lowercase; }
.brand-sub { font-size: 9.5px; letter-spacing: .32em; text-transform: uppercase; color: #D9A9AA; margin-top: 6px; }
.top-btn { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); background: none; border: 1px solid rgba(243,238,230,.25); color: #F3EEE6; border-radius: 999px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: 6px 11px; }
.top-btn.l { left: 12px; } .top-btn.r { right: 12px; }
.demo-bar { background: var(--rose-soft); color: var(--cacao); font-size: 12px; text-align: center; padding: 7px 16px; border-bottom: 1px solid var(--line); }

/* ---------- tipografía ---------- */
.eyebrow { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); font-weight: 500; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: 34px; line-height: 1.05; }
h2 { font-size: 25px; line-height: 1.1; }
h3 { font-size: 19px; line-height: 1.2; }
.lead { color: var(--ink2); font-size: 15px; margin: 8px 0 0; }
.small { font-size: 12.5px; color: var(--mute); }
.num { font-variant-numeric: tabular-nums; }
.sec { margin-top: 30px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 9px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r); border: 1px solid var(--ink); background: var(--ink); color: #F6F1E9; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; padding: 15px 18px; min-height: 50px; width: 100%; text-decoration: none; transition: background .15s, transform .1s; }
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--paper); color: var(--ink); border-color: var(--line); }
.btn.rose { background: var(--rose); border-color: var(--rose); color: #fff; }
.btn.sm { min-height: 38px; padding: 9px 14px; font-size: 10.5px; width: auto; }
.btn.big { min-height: 62px; font-size: 13px; }
.link { background: none; border: 0; color: var(--earth); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 4px 0; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.stack { display: grid; gap: 10px; }

/* ---------- formularios ---------- */
.field { display: grid; gap: 6px; }
.field label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); font-weight: 500; }
.field .opt { text-transform: none; letter-spacing: 0; font-size: 11px; }
input[type=text], input[type=tel], input[type=number], input[type=password], input[type=datetime-local], textarea, select {
  width: 100%; background: var(--bone); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; min-width: 0; }
input:focus, textarea:focus, select:focus { border-color: var(--earth); background: var(--paper); }
textarea { resize: vertical; min-height: 64px; }
.form { display: grid; gap: 14px; }
.msg { font-size: 13px; padding: 11px 13px; border-radius: 10px; }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg:empty { display: none; }

/* ---------- tarjeta de socia ---------- */
.mcard { position: relative; aspect-ratio: 1.586; max-width: 100%; border-radius: 16px; background: var(--ink); color: #F3EEE6; overflow: hidden; padding: 20px 22px; display: flex; flex-direction: column; justify-content: space-between;
  background-image: radial-gradient(120% 80% at 100% 0%, rgba(188,119,121,.22), transparent 55%), radial-gradient(90% 70% at 0% 100%, rgba(105,84,61,.35), transparent 60%);
  box-shadow: 0 18px 40px -22px rgba(37,42,28,.65); }
.mcard::before { content: ''; position: absolute; inset: 9px; border: 1px solid rgba(243,238,230,.16); border-radius: 10px; pointer-events: none; }
.mcard.vip { background-color: var(--cacao); }
.mcard.vip::before { border-color: rgba(217,169,170,.5); }
.mc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; position: relative; }
.mc-brand { font-family: var(--display); font-weight: 300; font-size: 23px; letter-spacing: .24em; line-height: 1; }
.mc-kind { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: #D9A9AA; text-align: right; line-height: 1.6; }
.mc-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; position: relative; }
.mc-name { font-family: var(--display); font-style: italic; font-size: 27px; line-height: 1.05; min-width: 0; overflow-wrap: anywhere; }
.mc-meta { text-align: right; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(243,238,230,.7); line-height: 1.7; white-space: nowrap; }
.mc-meta b { color: #F3EEE6; font-weight: 500; letter-spacing: .1em; font-size: 12px; }
.mc-done { display: flex; gap: 5px; justify-content: flex-end; margin-bottom: 4px; }
.mc-done i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgba(243,238,230,.55); }
.mc-done i.on { background: #D9A9AA; border-color: #D9A9AA; }

/* ---------- progreso y stamps ---------- */
.progress { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 26px; }
.count { font-family: var(--display); font-size: 58px; line-height: .85; font-weight: 400; letter-spacing: -.01em; white-space: nowrap; }
.count small { font-size: 26px; color: var(--mute); }
.count-label { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); margin-top: 8px; }
.next { text-align: right; max-width: 60%; font-size: 14px; color: var(--ink2); }
.next b { font-weight: 500; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px 8px; margin-top: 22px; padding: 20px 14px 14px; background: var(--bone); border-radius: 14px; }
.slot { display: grid; justify-items: center; gap: 5px; min-width: 0; }
.slot .hole { width: 100%; max-width: 50px; aspect-ratio: 1; border-radius: 50%; border: 1px dashed #CFC6B8; display: grid; place-items: center; position: relative; }
.slot.ms .hole { border: 1.5px solid var(--rose); background: var(--paper); }
.slot .hole .n { font-size: 11px; color: #B5AC9F; font-variant-numeric: tabular-nums; }
.slot.ms .hole .n { color: var(--rose); font-weight: 500; }
.slot .lbl { font-size: 8.5px; letter-spacing: .06em; color: var(--rose); text-align: center; line-height: 1.2; min-height: 11px; text-transform: uppercase; font-weight: 500; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slot .stamp { position: absolute; inset: -3px; }
.slot .stamp svg { width: 100%; height: 100%; display: block; }
.stamp.new { animation: stampIn .55s cubic-bezier(.2,.9,.25,1.15) both; }
@keyframes stampIn { 0% { opacity: 0; transform: scale(1.9) rotate(-18deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1) rotate(var(--rot, 0deg)); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 11.5px; color: var(--mute); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 16px; height: 16px; }

/* ---------- banner campaña ---------- */
.camp { margin-top: 16px; border-radius: 12px; background: var(--rose-soft); padding: 13px 15px; display: flex; gap: 12px; align-items: center; }
.camp .spark { font-family: var(--display); font-size: 26px; color: var(--rose); line-height: 1; }
.camp b { display: block; font-family: var(--display); font-size: 19px; font-weight: 500; color: var(--cacao); line-height: 1.15; }
.camp span { font-size: 12.5px; color: var(--cacao); opacity: .85; }

/* ---------- listas ---------- */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-size: 14.5px; color: var(--ink); }
.li .s { font-size: 12px; color: var(--mute); margin-top: 1px; }
.li .d { font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; width: 40px; flex-shrink: 0; letter-spacing: .04em; }
.li .plus { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.li .plus.neg { color: var(--bad); }
.li.off .t, .li.off .plus { text-decoration: line-through; color: var(--mute); }
.li.tap { cursor: pointer; }
.dot { width: 22px; height: 22px; flex-shrink: 0; }
.dot svg { width: 100%; height: 100%; display: block; }
.pill { display: inline-block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; font-weight: 500; white-space: nowrap; border: 1px solid var(--line); color: var(--mute); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.rose { background: var(--rose-soft); color: var(--cacao); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.ink { background: var(--ink); color: #F3EEE6; border-color: var(--ink); }

/* beneficios */
.ben { border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; display: grid; gap: 4px; }
.ben.ready { border-color: var(--rose); background: var(--rose-soft); }
.ben .bt { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.ben h3 { font-size: 21px; }
.ben p { margin: 0; font-size: 13.5px; color: var(--ink2); }
.ladder { display: grid; gap: 0; }
.rung { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rung:last-child { border-bottom: 0; }
.rung .at { font-family: var(--display); font-size: 26px; width: 34px; text-align: center; color: var(--rose); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.rung.done .at { color: var(--mute); }
.rung .grow { flex: 1; min-width: 0; }

/* ---------- hoja inferior / modal ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(37,42,28,.42); z-index: 50; display: grid; align-items: end; animation: fade .2s; }
.sheet { background: var(--paper); border-radius: 20px 20px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow: auto; width: 100%; max-width: 560px; margin: 0 auto; animation: up .25s cubic-bezier(.2,.8,.2,1); }
.sheet-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
.x { background: var(--bone); border: 0; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; color: var(--ink); flex-shrink: 0; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.qrbox { display: grid; justify-items: center; gap: 10px; padding: 10px 0 6px; }
.qrbox .qr { width: min(270px, 78vw); aspect-ratio: 1; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
.qrbox .qr svg, .qrbox .qr img { width: 100%; height: 100%; display: block; }

/* ---------- admin ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--paper); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { display: flex; width: 100%; max-width: 560px; }
.tab { flex: 1; background: none; border: 0; padding: 11px 4px 12px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); display: grid; justify-items: center; gap: 4px; font-weight: 500; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--ink); }
.tab.on svg { stroke: var(--rose); }
.search { display: flex; gap: 8px; }
.search input { flex: 1; font-size: 18px; padding: 15px 16px; }
.search .btn { width: auto; min-width: 58px; padding: 0 14px; }
.who { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; background: var(--bone); }
.who .grow { flex: 1; min-width: 0; }
.who h2 { font-size: 26px; overflow-wrap: anywhere; }
.mini { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.mini i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid #CFC6B8; }
.mini i.on { background: var(--ink); border-color: var(--ink); }
.mini i.b { background: var(--rose); border-color: var(--rose); }
.mini i.ms { border-color: var(--rose); border-width: 1.5px; }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 10px; }
.stepper button { height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--paper); font-size: 28px; line-height: 1; color: var(--ink); }
.stepper .val { text-align: center; font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.stepper .val small { display: block; font-family: var(--body); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 10px 14px; font-size: 13.5px; min-height: 42px; }
.chip.on { background: var(--ink); color: #F3EEE6; border-color: var(--ink); }
.chip.q { min-width: 46px; font-variant-numeric: tabular-nums; }
.calc { border-radius: 14px; border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 6px; }
.calc .tot { display: flex; justify-content: space-between; align-items: baseline; }
.calc .tot b { font-family: var(--display); font-size: 38px; font-weight: 500; line-height: 1; }
.calc .ln { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); }
.calc.x2 { border-color: var(--rose); background: var(--rose-soft); }
.result { text-align: center; padding: 8px 0 4px; display: grid; justify-items: center; gap: 8px; }
.result .bigstamp { width: 110px; height: 110px; }
.result .bigstamp svg { width: 100%; height: 100%; }
.result h2 { font-size: 34px; }
[hidden] { display: none !important; }
.unlock { background: var(--rose-soft); border-radius: 12px; padding: 12px 14px; color: var(--cacao); font-size: 14px; width: 100%; text-align: left; }
.unlock b { font-family: var(--display); font-size: 19px; font-weight: 500; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.kpi { padding: 14px 4px 13px; border-bottom: 1px solid var(--line); min-width: 0; }
.kpi:nth-child(odd) { padding-right: 12px; border-right: 1px solid var(--line); }
.kpi:nth-child(even) { padding-left: 14px; }
.kpi b { display: block; font-family: var(--display); font-size: 34px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11.5px; color: var(--mute); }
.bars { display: grid; gap: 9px; margin-top: 10px; }
.bar { display: grid; grid-template-columns: 70px 1fr 44px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar .tr { height: 10px; background: var(--bone2); border-radius: 6px; position: relative; overflow: visible; }
.bar .fl { height: 100%; background: var(--ink); border-radius: 6px; }
.bar .ref { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--rose); border-radius: 1px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); font-weight: 500; padding: 8px 6px 8px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px 6px 10px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl td:not(:first-child), .tbl th:not(:first-child) { text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 7px 13px; font-size: 12px; color: var(--mute); }
.seg button.on { background: var(--ink); color: #F3EEE6; }
.empty { text-align: center; color: var(--mute); font-size: 13.5px; padding: 28px 10px; }
.spin { width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--earth); border-radius: 50%; animation: rot .7s linear infinite; margin: 30px auto; }
@keyframes rot { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #F3EEE6; font-size: 13.5px; padding: 11px 16px; border-radius: 12px; z-index: 80; max-width: calc(100% - 32px); animation: up .2s; }
.scan video { width: 100%; border-radius: 14px; background: #000; aspect-ratio: 1; object-fit: cover; }
.home-hero { padding: 26px 0 6px; }
.home-card { margin: 26px 0 28px; transform: rotate(-2deg); }
.kbd { font-family: var(--display); font-size: 40px; letter-spacing: .5em; text-align: center; padding-left: .5em; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 380px) { .count { font-size: 50px; } .mc-name { font-size: 23px; } .grid { gap: 14px 6px; padding-inline: 10px; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ============================================================
   AINHOA CLUB CARD · Lógica central
   Este mismo código corre en el Apps Script (backend real)
   y en la app en modo demo. Si cambiás una regla, cambiala acá.
   ============================================================ */
var CORE = (function () {

  var SCHEMA = {
    Clientas:    ['ID', 'Token', 'Nombre', 'Apellido', 'Telefono', 'Cumple', 'Instagram', 'FechaAlta', 'Origen', 'CreadaPor', 'Notas', 'Activa'],
    Movimientos: ['ID', 'FechaHora', 'ClientaID', 'Clienta', 'Tipo', 'Motivo', 'Canal', 'Prendas', 'Stamps', 'Detalle', 'Monto', 'Campana', 'Admin', 'RefID', 'Notas', 'Anulado'],
    Beneficios:  ['Stamps', 'Nombre', 'Descripcion', 'DiasVigencia', 'Activo'],
    Canjes:      ['ID', 'ClientaID', 'Clienta', 'Beneficio', 'Descripcion', 'Stamps', 'Tarjeta', 'FechaDesbloqueo', 'Vence', 'Estado', 'FechaCanje', 'CanjeadoPor', 'MovimientoID', 'Notas'],
    Campanas:    ['ID', 'Nombre', 'Desde', 'Hasta', 'Multiplicador', 'BonusCompra', 'BonusAsistencia', 'Canales', 'Mensaje', 'Activa', 'CreadaPor'],
    Equipo:      ['Nombre', 'PIN', 'Rol', 'Activo'],
    Config:      ['Clave', 'Valor', 'Descripcion']

function gridHTML(t, nuevos) {

      '</div><div class="lbl">' + (isMs ? esc(isMs) : '') + '</div></div>';

}
function shortName(n) { return n.length > 12 ? n.split(' ')[0] : n; }
function legendHTML(t) {

function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise(function (ok, ko) { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
}
function openScan() {
  sheet('<div class="sheet-h"><h2>Escanear QR</h2><button class="x" data-act="closeSheet" aria-label="Cerrar">×</button></div><div class="scan"><video id="scanV" playsinline muted></video></div><p class="small" id="scanMsg" style="text-align:center">Apuntá al QR de la clienta.</p>');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return scanFail();
  Promise.all([loadJsQR(), navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })]).then(function (res) {
    scanStream = res[1]; var v = $('#scanV'); if (!v) return stopScan();
    v.srcObject = scanStream; v.play();
    var c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
    (function tick() {
      if (!scanStream) return;
      if (v.readyState === v.HAVE_ENOUGH_DATA) {
        var w = 480, h = Math.round(w * v.videoHeight / v.videoWidth); c.width = w; c.height = h; ctx.drawImage(v, 0, 0, w, h);
        var code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
        if (code && code.data) {
          var m = code.data.match(/[?&]c=([a-z0-9]+)/i);
          if (m) { closeSheet(); if (navigator.vibrate) navigator.vibrate(40); S.q = ''; buscar('?c=' + m[1]); return; }
          if (/[?&]alta/.test(code.data)) { var mm = $('#scanMsg'); if (mm) mm.textContent = 'Ese es el QR de alta, no el de una tarjeta.'; }
        }
      }
      scanRAF = requestAnimationFrame(tick);
    })();
  }).catch(scanFail);
}
function scanFail() { var m = $('#scanMsg'); if (m) m.textContent = 'No pude abrir la cámara. Buscala por los últimos 4 números de su celular.'; }
function stopScan() { if (scanRAF) cancelAnimationFrame(scanRAF); scanRAF = null; if (scanStream) scanStream.getTracks().forEach(function (t) { t.stop(); }); scanStream = null; }

/* ============================================================
   ACCIONES (un solo manejador de toques)
   ============================================================ */
var ACT = {
  toHome: function () { closeSheet(); go('home'); },
  toAlta: function () { if (!S.pub) api('publico').then(function (r) { S.pub = r; }).catch(function () {}); go('alta'); },
  toAdmin: function () { go('admin'); },
  demoCard: function () { api('buscar', { pin: '1234', q: 'Sofía' }).then(function (r) { return api('clienta', { pin: '1234', id: r[0].id }); }).then(function (t) { S.token = t.token; S.card = null; go('card'); }); },
  retryCard: function () { S.card = null; renderCard(); },
  qr: openQR,
  closeSheet: closeSheet,
  logout: function () { S.admin = null; S.cli = null; try { sessionStorage.removeItem('cc_admin'); } catch (e) {} go(DEMO ? 'home' : 'admin'); },
  tab: function (el) { S.tab = el.dataset.tab; S.panel = null; if (S.tab === 'camp') { S.camps = null; S.campEdit = null; } if (S.tab === 'num') S.stats = null; renderAdmin(); window.scrollTo(0, 0); },
  scan: openScan,
  pick: function (el) { pick(el.dataset.id); },
  clearCli: function () { S.cli = null; S.panel = null; renderAdmin(); },
  panel: function (el) {
    S.panel = el.dataset.p || null; S.pendingOp = null;
    if (S.panel === 'bonus') { var camp = (S.pub && S.pub.campanas || []).filter(function (c) { return c.bonusAsistencia; })[0]; S.bonus = { motivo: camp ? 'Feria' : 'El Círculo', cantidad: camp ? camp.bonusAsistencia : 1, notas: '' }; }
    if (S.panel === 'compra' && (!S.pub || Date.now() - S.pubAt > 300000)) loadPub().then(function () { if (S.panel === 'compra') renderAdmin(); });
    renderAdmin();
  },
  pr: function (el) { S.compra.prendas = Math.max(1, Math.min(40, S.compra.prendas + (+el.dataset.d))); renderAdmin(); },
  prSet: function (el) { S.compra.prendas = +el.dataset.n; renderAdmin(); },
  canal: function (el) { S.compra.canal = el.dataset.v; lsSet('cc_canal', el.dataset.v); renderAdmin(); },
  confirmCompra: function () { confirmCompra(false); },
  forceCompra: function () { confirmCompra(true); },
  motivo: function (el) { S.bonus.motivo = el.dataset.v; renderAdmin(); },
  bq: function (el) { S.bonus.cantidad = Math.max(1, Math.min(10, S.bonus.cantidad + (+el.dataset.d))); renderAdmin(); },
  confirmBonus: function () { confirmBonus(false); },
  forceBonus: function () { confirmBonus(true); },
  doneNext: function () { closeSheet(); S.cli = null; S.panel = null; renderAdmin(); },
  canjear: function (el) {
    var b = S.cli.disponibles.filter(function (x) { return x.id === el.dataset.id; })[0];
    sheet('<div class="sheet-h"><h2>Canjear</h2><button class="x" data-act="closeSheet" aria-label="Cerrar">×</button></div>' +
      '<p style="margin:0 0 6px">¿Canjear <b>' + esc(b.nombre) + '</b> de ' + esc(S.cli.nombre) + '?</p><p class="small">' + esc(b.descripcion) + '</p>' +
      '<div class="field" style="margin-top:12px"><label for="jNotas">Nota <span class="opt">(opcional, ej: qué regalo se llevó)</span></label><input id="jNotas" type="text"></div>' +
      '<div class="msg bad" id="jErr" style="margin-top:10px"></div>' +
      '<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="closeSheet">Cancelar</button><button class="btn rose" data-act="doCanje" data-id="' + esc(b.id) + '" id="jBtn">Canjear</button></div>');
  },
  doCanje: function (el) {
    var b = $('#jBtn'); b.disabled = true;
    A('canjear', { canjeId: el.dataset.id, notas: $('#jNotas').value, opId: opId() })
      .then(function (r) { S.cli = r.tarjeta; closeSheet(); renderAdmin(); toast(r.beneficio + ' canjeado.'); })
      .catch(function (e) { $('#jErr').textContent = e.message; b.disabled = false; });
  },
  anular: function (el) {
    sheet('<div class="sheet-h"><h2>Anular movimiento</h2><button class="x" data-act="closeSheet" aria-label="Cerrar">×</button></div>' +
      '<p class="small">El movimiento queda en el historial tachado y se descuentan sus stamps. Si había desbloqueado un beneficio sin usar, se anula.</p>' +
      '<div class="field" style="margin-top:12px"><label for="xMotivo">Motivo</label><input id="xMotivo" type="text" placeholder="Ej: se cargó a otra clienta"></div>' +
      '<div class="msg bad" id="xErr" style="margin-top:10px"></div>' +
      '<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="closeSheet">Cancelar</button><button class="btn" data-act="doAnular" data-id="' + esc(el.dataset.id) + '" id="xBtn">Anular</button></div>');
  },
  doAnular: function (el) {
    var b = $('#xBtn'); b.disabled = true;
    A('anular', { movId: el.dataset.id, motivo: $('#xMotivo').value, opId: opId() })
      .then(function (r) { S.cli = r.tarjeta; closeSheet(); renderAdmin(); toast('Movimiento anulado.'); })
      .catch(function (e) { $('#xErr').textContent = e.message; b.disabled = false; });
  },
  copy: function (el) {
    var v = el.dataset.v;
    var done = function () { toast('Link copiado.'); };
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(done, function () { toast('Mantené apretado el link para copiarlo.'); });
    else toast('Mantené apretado el link para copiarlo.');
  },
  altaQR: function () {
    sheet('<div class="sheet-h"><h2>QR de alta</h2><button class="x" data-act="closeSheet" aria-label="Cerrar">×</button></div>' +
      '<div class="qrbox"><div class="qr">' + qrSVG(baseUrl() + '?alta') + '</div><div class="eyebrow">Escaneá y creá tu Club Card</div>' +
      '<p class="small" style="text-align:center;margin:0">La clienta lo escanea con la cámara del celular, completa nombre y WhatsApp, y te muestra su QR.</p></div>');
  },
  campQuick: function () {
    var now = Date.now(), fin = new Date(); fin.setHours(23, 59, 0, 0);
    S.campEdit = { nombre: 'Bonus Stamp', desde: now, hasta: fin.getTime(), mult: 2, bonusCompra: 0, bonusAsistencia: 0, canales: 'Todos', mensaje: 'Hoy tu compra suma doble.', activa: true };
    renderAdmin();
  },
  campNew: function () { var now = Date.now(); S.campEdit = { nombre: '', desde: now, hasta: now + 86400000, mult: 2, bonusCompra: 0, bonusAsistencia: 1, canales: 'Todos', mensaje: '', activa: true }; renderAdmin(); },
  campEdit: function (el) { var c = S.camps[+el.dataset.i]; S.campEdit = JSON.parse(JSON.stringify(c)); renderAdmin(); },
  campCancel: function () { S.campEdit = null; renderAdmin(); },
  kMult: function (el) { readCampForm(); S.campEdit.mult = +el.dataset.v; renderAdmin(); },
  kCanal: function (el) {
    readCampForm(); var c = S.campEdit, sel = c.canales && c.canales !== 'Todos' ? c.canales.split(',').map(function (x) { return x.trim(); }) : [];
    var i = sel.indexOf(el.dataset.v); if (i >= 0) sel.splice(i, 1); else sel.push(el.dataset.v);
    c.canales = sel.length ? sel.join(', ') : 'Todos'; renderAdmin();
  },
  dias: function (el) { S.dias = +el.dataset.v; renderAdmin(); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault();
  ACT[el.dataset.act](el);
});

/* ---------- PWA: manifest según la página (así "Agregar a inicio" guarda TU tarjeta) ---------- */
function setManifest() {
  try {
    var start = location.href, abs = function (p) { return new URL(p, baseUrl()).href; };
    var m = { name: S.view === 'admin' ? 'Club Card Equipo' : 'Ainhoa Club Card', short_name: S.view === 'admin' ? 'Club Equipo' : 'Club Card', start_url: start, scope: baseUrl(), display: 'standalone',
      background_color: '#FFFFFF', theme_color: '#252A1C', icons: [{ src: abs('icon-192.png'), sizes: '192x192', type: 'image/png' }, { src: abs('icon-512.png'), sizes: '512x512', type: 'image/png' }, { src: abs('icon-512.png'), sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
    var l = $('link[rel=manifest]'); if (!l) { l = document.createElement('link'); l.rel = 'manifest'; document.head.appendChild(l); }
    l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m));
  } catch (e) {}
}

/* ---------- arranque ---------- */
(function init() {
  var q = {};
  try { new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; }); } catch (e) {}
  try { var a = sessionStorage.getItem('cc_admin'); if (a) S.admin = JSON.parse(a); } catch (e) {}
  if (q.c) { S.token = q.c; lsSet('cc_token', q.c); go('card'); }
  else if ('alta' in q) { go('alta'); api('publico').then(function (r) { S.pub = r; }).catch(function () {}); }
  else if ('equipo' in q || 'admin' in q) { go('admin'); if (S.admin) loadPub(); }
  else if (lsGet('cc_token') && !DEMO) { S.token = lsGet('cc_token'); go('card'); }
  else go('home');
  if (!DEMO && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
  setInterval(function () { if (S.view === 'admin' && S.admin) loadPub(); }, 300000);
})();
</script>
